services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: server
    networks:
      - miarete
    ports:
      - "8080:8080"
    volumes:
      - ../users.txt:/app/users.txt
      - ../server.log:/app/server.log
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 30

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    networks:
      - miarete
    depends_on:
      - server
    command: ["./bin/client", "server", "8080"]
    stdin_open: true
    tty: true

networks:
  miarete:
